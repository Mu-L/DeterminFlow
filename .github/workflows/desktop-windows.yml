name: Desktop Windows

on:
  workflow_dispatch:
  push:
    branches:
      - codex/desktop-tauri-poc
    paths:
      - ".github/workflows/desktop-windows.yml"
      - "config/**"
      - "desktop/**"
      - "requirements.lock"
      - "src/**"
      - "web/**"

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned NSIS installer
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock pyinstaller==6.21.0 pytest==9.1.1

      - name: Test desktop packaging contracts
        run: python -m pytest tests/test_desktop_packaging.py -q

      - name: Build web application
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build and smoke-test frozen backend
        run: |
          python desktop/scripts/build_backend.py
          python desktop/scripts/smoke_backend.py
          python desktop/scripts/verify_bundle.py

      - name: Install desktop build dependencies
        working-directory: desktop
        run: npm ci

      - name: Build NSIS installer
        working-directory: desktop
        run: npm run build

      - name: Locate and verify installer
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated" }
          python desktop/scripts/verify_bundle.py --installer $installer.FullName
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "checksum=$($installer.FullName).sha256" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: DeterminFlow-Windows-x64-unsigned
          path: |
            ${{ steps.installer.outputs.path }}
            ${{ steps.installer.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14
